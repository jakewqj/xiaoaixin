<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><title>Dolly Sprite Test</title><style>body { background-color: #2ab7ca; padding: 50px; font-family: sans-serif; color: white;} .sprite-box { display: inline-block; width: 112px; height: 48px; background-color: rgba(255,255,255,0.2); margin: 10px; border: 1px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); image-rendering: pixelated; } .anim-idle { background: url('assets/npc/dolly/idle.png') left center; animation: play-idle 1s steps(4) infinite; } .anim-happy { background: url('assets/npc/dolly/happy.png') left center; animation: play-happy 1.5s steps(6) infinite; } .anim-talk { background: url('assets/npc/dolly/talk.png') left center; animation: play-talk 1s steps(4) infinite; } @keyframes play-idle { 100% { background-position: -448px center; } } @keyframes play-happy { 100% { background-position: -672px center; } } @keyframes play-talk { 100% { background-position: -448px center; } }</style></head><body><h1>Dolly Sprite Sheet Inspection</h1><div><h2>Idle (4 frames, 112x48)</h2><div class='sprite-box anim-idle'></div></div><div><h2>Happy (6 frames, 112x48)</h2><div class='sprite-box anim-happy'></div></div><div><h2>Talk (4 frames, 112x48)</h2><div class='sprite-box anim-talk'></div></div></body></html>
