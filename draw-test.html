<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>绘画画布验证 · 小爱心</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #14495c;
        color: #e8dcc0;
        font: 14px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      h2 {
        margin: 16px 0 6px;
        font-size: 14px;
        color: #7fd1d8;
      }
      p.note {
        margin: 0 0 16px;
        color: #7fd1d8;
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      /* 纸和工具栏都在 DrawingBoard 里,这一页只负责给它一个宽度。
         --ui-scale 平时由 ScreenFrame 写在 :root 上,这一页没有舞台,
         走 index.css 里 var(--ui-scale, 2) 的兜底值 2 */
      .board {
        width: min(70vw, 640px);
      }
      .bar {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      /* 只给这一页自己那两个按钮上样式。**不能写成裸的 `button {}`** ——
         那会把圆角和背景色套到 DrawingBoard 的像素按钮上,
         圆角正是 §二十二·3 明令禁止的东西,而且这一页看着对了、游戏里却是另一套 */
      .bar button {
        padding: 8px 16px;
        border: 1px solid #e8dcc0;
        border-radius: 4px;
        background: #2e8b9b;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      aside {
        flex: 1;
        min-width: 260px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 0;
        border-bottom: 1px solid rgba(232, 220, 192, 0.15);
      }
      .row b {
        color: #fff;
      }
      pre {
        margin: 0;
        padding: 12px;
        max-height: 34vh;
        overflow: auto;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
        white-space: pre-wrap;
      }
      aside img {
        width: 100%;
        border: 2px solid #e8dcc0;
        background: #fffdf6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/draw-test.tsx"></script>
  </body>
</html>
